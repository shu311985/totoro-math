<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>历史题目 - 龙猫数学助手</title>
<style>
    body {
        margin: 0; min-height: 100vh;
        background: url('https://wallpapers-clan.com/wp-content/uploads/2024/07/totoro-tree-anime-desktop-wallpaper-preview-1024x576.jpg') no-repeat center center/cover;
        display: flex; flex-direction: column; align-items: center;
        font-family: 'PingFang SC', sans-serif; color: #fff; padding: 40px;
    }

    .history-card {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 0, 0, 0.8);
        padding: 30px; border-radius: 30px;
        width: 80%; max-width: 800px;
    }

    #history-list {
        display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 20px; margin-top: 20px;
    }

    .item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; text-align: center; }
    .item img { width: 100%; border-radius: 10px; }

    .back-link { margin-top: 30px; opacity: 0.7; color: #fff; text-decoration: none; }
</style>
</head>
<body>

    <div class="history-card">
        <h2>我的森林书架</h2>
        <div id="history-list"></div>
    </div>
    
    <a href="index.html" class="back-link">← 返回首页</a>

    <script>
        // 读取并展示数据
        window.onload = function() {
            let history = JSON.parse(localStorage.getItem('mathHistory') || '[]');
            let listContainer = document.getElementById('history-list');
            
            if(history.length === 0) {
                listContainer.innerHTML = "<p>森林里空空的，快去拍一张题目吧~</p>";
                return;
            }

            history.forEach(item => {
                let div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<img src="${item.img}"><p style="font-size:12px;">${item.time}</p>`;
                listContainer.appendChild(div);
            });
        };
    </script>
</body>
</html>
