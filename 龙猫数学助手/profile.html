<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 龙猫数学助手</title>
    <style>
        body { 
            margin: 0;
            background: url('https://images5.alphacoders.com/926/thumb-1920-926342.jpg') no-repeat center center/cover; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: 'PingFang SC', sans-serif;
        }
        .profile-card { 
            background: rgba(0, 0, 0, 0.6); 
            padding: 50px; 
            border-radius: 30px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 300px;
        }
        .btn-group { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .action-btn {
            padding: 10px 30px; border: none; border-radius: 20px;
            color: #fff; cursor: pointer; font-size: 14px;
        }
        .logout-btn { background: #e76f51; }
        .back-btn { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div class="profile-card">
    <h2 id="welcome-msg">正在识别身份...</h2>
    <p>这里记录了你的所有数学足迹</p>
    <div id="user-stats">
        <p>已完成题目: <span id="task-count">0</span></p>
    </div>
    
    <div class="btn-group">
        <button onclick="window.location.href='index.html'" class="action-btn back-btn">返回首页</button>
        <button onclick="logout()" class="action-btn logout-btn">退出登录</button>
    </div>
</div>

<script>
    window.onload = function() {
        const user = localStorage.getItem('totoro_user');
        if (!user) {
            alert("请先登录喔~");
            window.location.href = 'login.html';
            return;
        }
        document.getElementById('welcome-msg').innerText = "你好, " + user;
    };

    function logout() {
        localStorage.removeItem('totoro_user');
        window.location.href = 'index.html';
    }
</script>
</body>
</html>
